# Kullanım testi — referans nesne kütüphanesi (coo/kullanim_testi.py okur)
#
# Kural: her ölçünün yanında kaynak URL'si + erişim tarihi bulunur. Üretici sayfasında doğrulanamayan veya
# bizim türettiğimiz/varsaydığımız değer `dogrulanmadi: true` ile işaretlenir ve raporda "varsayım" diye yazılır.
# Birim: mm, g. Nesne yerel ekseni: x = genişlik, y = boy (telefon: alt kenar −y, üst +y; kol: tutamaklar +y),
# z = kalınlık (ekran / yüz +z).
#
# Geometri, ölçüye sadık ama BASİT ilkel bileşimidir (kutu, kapsül, elipsoid, silindir). Gerçek ürünün
# eğrileri, düğmeleri ve doku ayrıntısı yoktur; dış zarf (bounding box) ve kütle resmi değere sadıktır.

surum: 1
guncelleme: '2026-11-18'

nesneler:

  # ------------------------------------------------------------------------------------------------ telefonlar
